<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Receipt Analyzer - MFU Project</title>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: #e2e8f0;
  padding: 20px;
}
.container {
  max-width: 950px;
  margin: auto;
  background: #1e293b;
  padding: 25px;
  border-radius: 12px;
}
h2 {
  margin-bottom: 10px;
}
.upload {
  border: 2px dashed #334155;
  padding: 25px;
  text-align: center;
  border-radius: 10px;
  cursor: pointer;
}
.result {
  margin-top: 20px;
  background: #020617;
  padding: 20px;
  border-radius: 10px;
}
.section {
  margin-top: 20px;
  font-weight: bold;
  color: #38bdf8;
}
.field {
  margin-bottom: 12px;
}
.label {
  font-size: 12px;
  color: #94a3b8;
}
.value {
  font-size: 14px;
}
.ok { color: #22c55e; }
.miss { color: #ef4444; }
img {
  max-width: 100%;
  margin-top: 10px;
  border-radius: 10px;
}
</style>

</head>

<body>

<div class="container">

  <h2>🧾 AI Receipt Analyzer (MFU Exhibition)</h2>

  <div class="upload" onclick="fileInput.click()">
    Click or Drop Receipt Image
    <input type="file" id="fileInput" hidden accept="image/*">
  </div>

  <div id="status"></div>
  <img id="preview">
  <div class="result" id="result"></div>

</div>

<script>

// 🔑 PUT YOUR API KEY HERE
const API_KEY = "sk-HytrxVrL2v19alxMtEs8BzXfGpzTWX5Uc7x6q4mYR9osAcYl";


// MFU constant
const MFU_TAX = "0994000163481";

// ================= OCR =================
async function runOCR(file) {
  let formData = new FormData();
  formData.append("file", file);
  formData.append("model", "typhoon-ocr");

  let res = await fetch("https://api.opentyphoon.ai/v1/ocr", {
    method: "POST",
    headers: { "Authorization": "Bearer " + API_KEY },
    body: formData
  });

  let data = await res.json();
  let raw = data.results[0].message.choices[0].message.content;
  return raw.replace(/<[^>]*>/g, "");
}

// ================= SAFE =================
function safe(v) {
  return v && v.trim() !== "" ? v : "NOT FOUND";
}

// ================= BASIC DETECTION =================
function detectStore(text) {
  let lines = text.split("\n");
  for (let l of lines.slice(0,6)) {
    if (l.length > 3 && !/\d{5,}/.test(l)) return l;
  }
  return null;
}

function detectDate(text) {
  let m = text.match(/\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}/);
  return m ? m[0] : null;
}

function detectTotal(text) {
  let nums = text.match(/(\d+[.,]\d{2})/g);
  return nums ? nums[nums.length - 1] : null;
}

function detectTax(text) {
  let m = text.match(/\b\d{13}\b/);
  return m ? m[0] : null;
}

// ================= MFU DETECTION =================
function detectMFU(text) {
  let t = text.toLowerCase();

  let found =
    t.includes("mae fah luang") ||
    t.includes("แม่ฟ้าหลวง") ||
    text.includes(MFU_TAX);

  if (!found) return null;

  return {
    name: "Mae Fah Luang University",
    address: "333 Moo 1, Thasud, Chiang Rai 57100",
    tax: MFU_TAX
  };
}

// ================= ITEMS =================
function detectItems(text) {
  let lines = text.split("\n");
  let items = [];

  for (let l of lines) {
    if (/\d+[.,]\d{2}/.test(l) &&
        l.length > 5 &&
        !/total|vat/i.test(l)) {
      items.push(l.trim());
    }
  }

  return items.slice(0,5);
}

// ================= AMOUNT WORDS =================
function detectAmountWords(text) {
  let lines = text.split("\n");

  for (let l of lines) {
    if ((l.toLowerCase().includes("baht") || l.includes("บาท")) &&
        isNaN(l)) {
      return l.trim();
    }
  }

  return null;
}

// ================= MAIN PROCESS =================
async function process(text) {

  let base = {
    store: detectStore(text),
    date: detectDate(text),
    total: detectTotal(text),
    tax: detectTax(text)
  };

  let mfu = detectMFU(text);
  let items = detectItems(text);
  let words = detectAmountWords(text);

  return {
    store: safe(base.store),
    date: safe(base.date),
    total: safe(base.total),
    tax: safe(base.tax),

    mfu_name: mfu ? mfu.name : "NOT FOUND",
    mfu_address: mfu ? mfu.address : "NOT FOUND",
    mfu_tax: mfu ? mfu.tax : "NOT FOUND",

    amount_words: safe(words),
    items: items.length ? items.join("<br>") : "NOT FOUND"
  };
}

// ================= UI =================
function render(data) {

  let html = "";

  html += section("Basic Info");
  html += field("Store", data.store);
  html += field("Date", data.date);
  html += field("Total", data.total);
  html += field("Tax ID", data.tax);

  html += section("MFU Info");
  html += field("MFU Name", data.mfu_name);
  html += field("MFU Address", data.mfu_address);
  html += field("MFU Tax", data.mfu_tax);

  html += section("Extra");
  html += field("Amount in Words", data.amount_words);
  html += field("Items", data.items);

  document.getElementById("result").innerHTML = html;
}

function section(title) {
  return `<div class="section">${title}</div>`;
}

function field(label, value) {
  let cls = value === "NOT FOUND" ? "miss" : "ok";
  return `
    <div class="field">
      <div class="label">${label}</div>
      <div class="value ${cls}">${value}</div>
    </div>
  `;
}

// ================= EVENT =================
fileInput.addEventListener("change", async (e) => {

  let file = e.target.files[0];
  if (!file) return;

  document.getElementById("preview").src = URL.createObjectURL(file);
  document.getElementById("status").innerText = "⏳ Processing...";

  try {

    let text = await runOCR(file);
    console.log("OCR TEXT:", text);

    let result = await process(text);
    render(result);

    document.getElementById("status").innerText = "✅ Done";

  } catch (err) {

    console.error(err);
    document.getElementById("status").innerText = "❌ Error";

  }
});

</script>

</body>
</html>
